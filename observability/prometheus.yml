global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: api
    static_configs: [{targets: ["api:8000"]}]
  - job_name: llm-gateway
    static_configs: [{targets: ["llm-gateway:8100"]}]
  - job_name: llm-stub
    static_configs: [{targets: ["llm-stub:8200"]}]
  # DNS service discovery: every replica after `--scale agent-worker=3` is scraped
  - job_name: agent-worker
    dns_sd_configs: [{names: ["agent-worker"], type: A, port: 9101, refresh_interval: 10s}]
  - job_name: verifier-worker
    dns_sd_configs: [{names: ["verifier-worker"], type: A, port: 9102, refresh_interval: 10s}]
  - job_name: resource-exporter
    static_configs: [{targets: ["resource-exporter:9103"]}]
  - job_name: jaeger
    static_configs: [{targets: ["jaeger:14269"]}]
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
