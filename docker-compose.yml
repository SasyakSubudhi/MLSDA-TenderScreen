# TenderScreen - start everything with:   docker compose up --build
# Scale the research agent with:          docker compose up -d --scale agent-worker=3
#
# Configuration is injected per service. .env.example holds the documented,
# NON-SECRET defaults and is the only env file the containers read, so a clean
# clone starts with the built-in stub and nothing else is needed. The project
# .env (git-ignored) is used only by Compose itself, to fill the ${VAR}
# references below (ports, worker count and the x-tunables block); it is never
# injected wholesale into a container. A provider API key is a file secret, mounted into llm-gateway only:
#   docker compose -f docker-compose.yml -f docker-compose.hosted.yml up -d
# See docs/SECRETS.md. Published ports are bound to 127.0.0.1; see
# docker-compose.shared.yml for shared deployments.

x-tunables: &tunables
  # Non-secret, per-run tunables. The default after ":-" repeats the value in .env.example
  # (tests/test_compose_config.py keeps the two in step); a value in your shell or in the
  # project .env overrides it. Secrets never go here - see docs/SECRETS.md.
  LLM_PROVIDER_NAME: ${LLM_PROVIDER_NAME:-stub}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://llm-stub:8200/v1}
  LLM_MODEL: ${LLM_MODEL:-}
  LLM_PRICE_INPUT_PER_1M: ${LLM_PRICE_INPUT_PER_1M:-0.10}
  LLM_PRICE_OUTPUT_PER_1M: ${LLM_PRICE_OUTPUT_PER_1M:-0.40}
  LLM_DAILY_BUDGET_USD: ${LLM_DAILY_BUDGET_USD:-1.00}
  LLM_PROVIDER_TIMEOUT_S: ${LLM_PROVIDER_TIMEOUT_S:-20}
  LLM_CALL_TIMEOUT_S: ${LLM_CALL_TIMEOUT_S:-30}
  LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
  LLM_BACKOFF_BASE_S: ${LLM_BACKOFF_BASE_S:-0.5}
  BREAKER_FAILURE_THRESHOLD: ${BREAKER_FAILURE_THRESHOLD:-5}
  BREAKER_OPEN_SECONDS: ${BREAKER_OPEN_SECONDS:-20}
  LLM_CACHE_ENABLED: ${LLM_CACHE_ENABLED:-true}
  LLM_CACHE_TTL_S: ${LLM_CACHE_TTL_S:-86400}
  STUB_DELAY_MS: ${STUB_DELAY_MS:-800}
  STUB_JITTER_MS: ${STUB_JITTER_MS:-200}
  STUB_MODE: ${STUB_MODE:-ok}
  RETRIEVAL_CACHE_ENABLED: ${RETRIEVAL_CACHE_ENABLED:-true}
  RUN_CACHE_ENABLED: ${RUN_CACHE_ENABLED:-true}
  RUN_TIMEOUT_S: ${RUN_TIMEOUT_S:-90}
  RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-30}
  AGENT_POLICY_SAFEGUARD: ${AGENT_POLICY_SAFEGUARD:-true}
  DEMO_MODE: ${DEMO_MODE:-true}

x-app: &app
  image: tenderscreen-app:latest
  build:
    context: .
  env_file:
    - path: .env.example
      required: true
  restart: unless-stopped
  networks: [tenderscreen]

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [tenderscreen]

  # one-shot: read -> parse -> chunk -> embed -> index (idempotent, incremental)
  indexer:
    <<: *app
    command: ["python", "-m", "tenderscreen.retrieval.ingest"]
    environment:
      <<: *tunables
      SERVICE_NAME: indexer
    volumes: [index-data:/data]
    restart: "no"

  llm-stub:
    <<: *app
    command: ["uvicorn", "tenderscreen.llm.stub_service:app", "--host", "0.0.0.0", "--port", "8200", "--no-access-log"]
    environment:
      <<: *tunables
      SERVICE_NAME: llm-stub
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8200/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm-gateway:
    <<: *app
    command: ["uvicorn", "tenderscreen.llm.gateway:app", "--host", "0.0.0.0", "--port", "8100", "--no-access-log"]
    environment:
      <<: *tunables
      SERVICE_NAME: llm-gateway
    depends_on:
      redis: {condition: service_healthy}
      llm-stub: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8100/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *app
    command: ["uvicorn", "tenderscreen.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    environment:
      <<: *tunables
      SERVICE_NAME: api
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes: [index-data:/data:ro]
    depends_on:
      redis: {condition: service_healthy}
      llm-gateway: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  # research agent (agent 1) - the service to scale
  agent-worker:
    <<: *app
    command: ["python", "-m", "tenderscreen.agents.worker"]
    environment:
      <<: *tunables
      SERVICE_NAME: agent-worker
      WORKER_ROLE: research
      METRICS_PORT: "9101"
    # three research workers by default: the load test showed one worker misses the
    # p95 <= 30 s SLO at 10 users (32 s) and three meet it (9.2 s) - see docs/LOADTEST.md
    deploy:
      replicas: ${AGENT_WORKERS:-3}
    volumes: [index-data:/data]
    depends_on:
      redis: {condition: service_healthy}
      llm-gateway: {condition: service_healthy}
      indexer: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9101/metrics',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  # verifier agent (agent 2)
  verifier-worker:
    <<: *app
    command: ["python", "-m", "tenderscreen.agents.worker"]
    environment:
      <<: *tunables
      SERVICE_NAME: verifier-worker
      WORKER_ROLE: verifier
      METRICS_PORT: "9102"
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:9102/metrics',timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12

  # CPU / memory / uptime / restarts of every container in this project (reads the Docker API read-only)
  resource-exporter:
    <<: *app
    command: ["python", "-m", "tenderscreen.llm.resource_exporter"]
    # No raw Docker socket here: container metrics come through the read-only, container-scoped
    # docker-socket-proxy below (GET /containers/* only).
    environment:
      <<: *tunables
      SERVICE_NAME: resource-exporter
      METRICS_PORT: "9103"
      DOCKER_API_URL: http://docker-proxy:2375
    depends_on: [docker-proxy]

  # The ONLY service that touches /var/run/docker.sock. It is not published to the host, and it
  # answers only read-only container queries (no POST, exec, images, volumes, networks, ...).
  # This is still a trusted component: a mounted Docker socket is root-equivalent on the host
  # if the proxy itself were compromised, so do not publish port 2375 or add it to other networks.
  docker-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    environment:
      CONTAINERS: "1"   # allow GET /containers/*
      POST: "0"         # no state-changing calls
      INFO: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      EXEC: "0"
      SERVICES: "0"
      TASKS: "0"
      SECRETS: "0"
      CONFIGS: "0"
      SWARM: "0"
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      DISTRIBUTION: "0"
      EVENTS: "0"
      NODES: "0"
      PLUGINS: "0"
      SESSION: "0"
      SYSTEM: "0"
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped
    networks: [tenderscreen]

  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports: ["127.0.0.1:9090:9090"]
    restart: unless-stopped
    networks: [tenderscreen]

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tenderscreen.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]
    depends_on: [prometheus]
    restart: unless-stopped
    networks: [tenderscreen]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["127.0.0.1:16686:16686"]
    restart: unless-stopped
    networks: [tenderscreen]

  # optional real model on your own machine (no API key needed):
  #   LLM_BASE_URL=http://ollama:11434/v1 LLM_MODEL=tenderscreen-local OLLAMA_MODEL=<model id> \
  #     docker compose --profile local-llm up -d
  #   (these are read from your shell or the project .env for ${VAR} substitution; .env is not injected into containers.)
  ollama:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: "2"
    volumes: [ollama-models:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    networks: [tenderscreen]

  # one-shot: downloads the model named in OLLAMA_MODEL (shell / --env-file) into the ollama volume
  ollama-pull:
    image: ollama/ollama:0.5.7
    profiles: ["local-llm"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-}
    # pulls OLLAMA_MODEL and registers it as "tenderscreen-local" with a 4096-token context
    # (the default 2048 truncates the drafting prompt - incident INC-10)
    entrypoint: ["/bin/sh", "-c", "test -n \"$$OLLAMA_MODEL\" || { echo 'set OLLAMA_MODEL in your shell or --env-file'; exit 1; }; ollama pull \"$$OLLAMA_MODEL\" && printf 'FROM %s\\nPARAMETER num_ctx 4096\\nPARAMETER temperature 0\\n' \"$$OLLAMA_MODEL\" > /tmp/Modelfile && ollama create tenderscreen-local -f /tmp/Modelfile"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"
    networks: [tenderscreen]

  # load generator - only started on demand:
  #   docker compose --profile loadtest run --rm locust ...
  locust:
    image: locustio/locust:2.32.5
    profiles: ["loadtest"]
    user: "0"   # write CSV results into the bind-mounted folder on any host OS
    volumes: ["./loadtest:/mnt/locust", "./examples:/mnt/examples:ro"]
    working_dir: /mnt/locust
    entrypoint: ["locust", "-f", "/mnt/locust/locustfile.py"]
    networks: [tenderscreen]

volumes:
  redis-data:
  index-data:
  prometheus-data:
  grafana-data:
  ollama-models:

networks:
  tenderscreen:
